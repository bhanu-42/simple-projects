<DOCTYPE html>
<html>
<head>
<style>
/*unvisited linl*/
a:link{
    color:red;
}
/*visited link*/
a:visited{
    color:green;
}
/*mouse overlink*/
a:hover{
    color:hotpink;
}
</style>
</head>
<body>

<h2>Styling a link depends on state</h2><h2>
<p><b><a href="default.asp"target="-blank">this is a link</a></b></p>

</body>
</html>
