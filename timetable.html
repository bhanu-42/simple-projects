<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timetable</title>

<style>
body { font-family: Arial, sans-serif; }

h2 {
    text-align: center;
    padding: 20px;
    background: aqua;
}

table {
    width: 80%;
    margin: 20px auto;
    border-collapse: collapse;
    background: linear-gradient(skyblue, green);
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

th { background: #f2f2f2; }

tr:hover { background: #11d3fa; }

.checkbox { cursor: pointer; }

button {
    display: block;
    margin: 20px auto;
    padding: 10px 20px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #6ee273;
    transform: scale(1.1);
}
</style>
</head>

<body>

<h2>Weekly Timetable</h2>

<form>
<table>
<tr>
    <th>Time</th>
    <th>Mon</th>
    <th>Tue</th>
    <th>Wed</th>
    <th>Thu</th>
    <th>Fri</th>
    <th>Sat</th>
    <th>Sun</th>
</tr>

<tr>
    <td>6–7 AM</td>
    <td>5k Run</td>
    <td>Leg</td>
    <td>VO2</td>
    <td>Strength</td>
    <td>1600m</td>
    <td>Stretch</td>
    <td>Walk</td>
</tr>

<tr>
    <td>Done?</td>
    <td><input type="checkbox" class="checkbox"></td>
    <td><input type="checkbox" class="checkbox"></td>
    <td><input type="checkbox" class="checkbox"></td>
    <td><input type="checkbox" class="checkbox"></td>
    <td><input type="checkbox" class="checkbox"></td>
    <td><input type="checkbox" class="checkbox"></td>
    <td><input type="checkbox" class="checkbox"></td>
</tr>

</table>

<button type="submit">Submit</button>
</form>

</body>
</html>
